name: "T3 Reference: ET Benchmark"
description: |
  Reference workflow for Task 03. Benchmarks E3SM ELM evapotranspiration
  against MODIS observations over 1985-1989: fetch MODIS ET from ILAMB,
  extract climatological model ET as composite (QVEGE+QVEGT+QSOIL),
  compute spatial bias, and map.

settings:
  output_dir: ./output/task03_et_benchmark
  data_dir: ./data/sample/e3sm
  case_name: sample.v3.LR.historical
  years: [1985, 1986, 1987, 1988, 1989]

steps:
  - id: fetch_modis
    tool: fetch_ilamb_data
    params:
      variable: evspsbl
      dataset: MODIS
    outputs:
      data_file: modis_et.nc

  - id: extract_model_et
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: "QVEGE+QVEGT+QSOIL"
      years: "${settings.years}"
    outputs:
      field_file: model_et_mean.nc

  - id: extract_obs_et
    tool: extract_gridded_field
    params:
      obs_file: "${fetch_modis.outputs.data_file}"
      variable: et
    outputs:
      field_file: modis_et_mean.nc

  - id: compute_bias
    tool: compute_spatial_bias
    params:
      field_a: "${extract_model_et.outputs.field_file}"
      field_b: "${extract_obs_et.outputs.field_file}"
    outputs:
      bias_file: et_bias.nc
      stats_file: et_bias_stats.csv

  - id: map_comparison
    tool: plot_bias_comparison
    params:
      obs_file: "${extract_obs_et.outputs.field_file}"
      sim_file: "${extract_model_et.outputs.field_file}"
      bias_file: "${compute_bias.outputs.bias_file}"
      obs_label: "MODIS ET"
      sim_label: "E3SM ET"
      bias_label: "Bias (E3SM − MODIS)"
      stats_file: "${compute_bias.outputs.stats_file}"
    outputs:
      plot_file: et_bias_comparison.png
