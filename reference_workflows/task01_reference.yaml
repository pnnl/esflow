name: "T1 Reference: Observation Summary"
description: |
  Reference workflow for Task 01. Loads gauge metadata, extracts
  observed streamflow for six named gauges over 1985-1989, and
  reports summary statistics for each.

settings:
  output_dir: ./output/task01_obs_summary
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  obs_dir: ./data/sample/obs/streamflow
  gauge_ids: "3629000,4121801,4115200,6742900,2969100,1159100"
  years: [1985, 1986, 1987, 1988, 1989]

steps:
  - id: load_metadata
    tool: load_obs_metadata
    params:
      metadata_file: "${settings.metadata_file}"
    outputs:
      metadata_file: gauge_metadata.csv

  - id: extract_obs
    tool: extract_obs_timeseries
    params:
      obs_dir: "${settings.obs_dir}"
      gauge_metadata: "${load_metadata.outputs.metadata_file}"
      gauge_ids: "${settings.gauge_ids}"
      years: "${settings.years}"
    outputs:
      timeseries_file: obs_timeseries.csv

  - id: compute_stats
    tool: compute_summary_stats
    params:
      timeseries_file: "${extract_obs.outputs.timeseries_file}"
      gauge_metadata: "${load_metadata.outputs.metadata_file}"
    outputs:
      stats_file: summary_stats.csv
