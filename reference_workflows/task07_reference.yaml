name: "T7 Reference: Basin Water Cycle Evaluation"
description: |
  Reference workflow for Task 07. Per-basin integrated water cycle
  evaluation for six major rivers over 1985-1989. Extracts gridded
  model fields (P, ET, Q) and observations (GPCC P, MODIS ET, LORA runoff),
  clips each to basin polygons, computes streamflow FDC metrics,
  combines all into a per-basin budget summary, and produces a model-vs-obs
  budget comparison bar chart and radar charts diagnosing where model
  biases originate.

settings:
  output_dir: ./output/task07_integrated_diagnostic
  data_dir: ./data/sample/e3sm
  case_name: sample.v3.LR.historical
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  obs_dir: ./data/sample/obs/streamflow
  basins_file: ./data/sample/obs/basin_polygons.geojson
  basin_gauges: "3629000,4121801,4115200,6742900,2969100,1159100"
  years: [1985, 1986, 1987, 1988, 1989]

steps:
  # ── Part 1: Extract model gridded fields ─────────────────────────

  - id: extract_precip
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: "RAIN+SNOW"
      years: "${settings.years}"
    outputs:
      field_file: precip_mean.nc

  - id: extract_model_et
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: "QVEGE+QVEGT+QSOIL"
      years: "${settings.years}"
    outputs:
      field_file: model_et_mean.nc

  - id: extract_model_runoff
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: QRUNOFF
      years: "${settings.years}"
    outputs:
      field_file: model_runoff_mean.nc

  # ── Part 2: Fetch and extract observation fields ─────────────────

  - id: fetch_gpcc
    tool: fetch_ilamb_data
    params:
      variable: pr
      dataset: GPCCv2018
    outputs:
      data_file: gpcc_precip.nc

  - id: extract_obs_precip
    tool: extract_gridded_field
    params:
      obs_file: "${fetch_gpcc.outputs.data_file}"
      variable: pr
    outputs:
      field_file: obs_precip_mean.nc

  - id: fetch_modis
    tool: fetch_ilamb_data
    params:
      variable: evspsbl
      dataset: MODIS
    outputs:
      data_file: modis_et.nc

  - id: extract_obs_et
    tool: extract_gridded_field
    params:
      obs_file: "${fetch_modis.outputs.data_file}"
      variable: et
    outputs:
      field_file: obs_et_mean.nc

  - id: fetch_lora
    tool: fetch_ilamb_data
    params:
      variable: mrro
      dataset: LORA
    outputs:
      data_file: lora_runoff.nc

  - id: extract_obs_runoff
    tool: extract_gridded_field
    params:
      obs_file: "${fetch_lora.outputs.data_file}"
      variable: mrro
    outputs:
      field_file: obs_runoff_mean.nc

  # ── Part 3: Clip gridded fields to basin means ──────────────────

  - id: clip_model_precip
    tool: extract_basin_mean
    params:
      field_file: "${extract_precip.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: model_precip_basin.csv

  - id: clip_model_et
    tool: extract_basin_mean
    params:
      field_file: "${extract_model_et.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: model_et_basin.csv

  - id: clip_model_runoff
    tool: extract_basin_mean
    params:
      field_file: "${extract_model_runoff.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: model_runoff_basin.csv

  - id: clip_obs_precip
    tool: extract_basin_mean
    params:
      field_file: "${extract_obs_precip.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: obs_precip_basin.csv

  - id: clip_obs_et
    tool: extract_basin_mean
    params:
      field_file: "${extract_obs_et.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: obs_et_basin.csv

  - id: clip_obs_runoff
    tool: extract_basin_mean
    params:
      field_file: "${extract_obs_runoff.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: obs_runoff_basin.csv

  # ── Part 4: Streamflow FDC metrics ──────────────────────────────

  - id: load_metadata
    tool: load_obs_metadata
    params:
      metadata_file: "${settings.metadata_file}"
    outputs:
      metadata_file: gauge_metadata.csv

  - id: match_gauges
    tool: match_to_grid
    params:
      gauge_metadata: "${load_metadata.outputs.metadata_file}"
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: mosart
    outputs:
      matched_file: matched_gauges.csv

  - id: extract_sim_discharge
    tool: extract_e3sm_timeseries
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: mosart
      variable: RIVER_DISCHARGE_OVER_LAND_LIQ
      locations_file: "${match_gauges.outputs.matched_file}"
      years: "${settings.years}"
    outputs:
      timeseries_file: sim_discharge.csv

  - id: extract_obs_discharge
    tool: extract_obs_timeseries
    params:
      obs_dir: "${settings.obs_dir}"
      gauge_metadata: "${load_metadata.outputs.metadata_file}"
      years: "${settings.years}"
    outputs:
      timeseries_file: obs_discharge.csv

  - id: streamflow_fdc
    tool: compute_fdc_metrics
    params:
      sim_file: "${extract_sim_discharge.outputs.timeseries_file}"
      obs_file: "${extract_obs_discharge.outputs.timeseries_file}"
    outputs:
      metrics_file: fdc_metrics.csv
      fdc_file: fdc_data.csv

  # ── Part 5: Combine budget, plot comparison and radar ──────────

  - id: basin_budget
    tool: compute_basin_budget
    params:
      model_precip_file: "${clip_model_precip.outputs.basin_means_file}"
      model_et_file: "${clip_model_et.outputs.basin_means_file}"
      model_runoff_file: "${clip_model_runoff.outputs.basin_means_file}"
      obs_precip_file: "${clip_obs_precip.outputs.basin_means_file}"
      obs_et_file: "${clip_obs_et.outputs.basin_means_file}"
      obs_runoff_file: "${clip_obs_runoff.outputs.basin_means_file}"
      fdc_metrics_file: "${streamflow_fdc.outputs.metrics_file}"
      locations_file: "${load_metadata.outputs.metadata_file}"
    outputs:
      budget_file: basin_budget.csv

  - id: plot_comparison
    tool: plot_basin_budget_comparison
    params:
      budget_file: "${basin_budget.outputs.budget_file}"
    outputs:
      plot_file: basin_budget_comparison.png

  - id: plot_radar
    tool: plot_basin_radar
    params:
      budget_file: "${basin_budget.outputs.budget_file}"
    outputs:
      plot_file: basin_radar.png
