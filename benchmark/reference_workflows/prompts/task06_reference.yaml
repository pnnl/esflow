name: "T6 Reference: Water Balance"
description: |
  Reference workflow for Task 06. Checks E3SM land water balance closure
  over 1985-1989: extract climatological P (RAIN+SNOW), ET (QVEGE+QVEGT+QSOIL),
  and QRUNOFF; compute area-weighted global means of each; compute the residual
  P - ET - Q as a spatial field; then clip all four fields to the six major
  basins and produce a composite figure with the global residual map and
  per-basin bar charts of P, ET, Q, and residual.

settings:
  output_dir: ./output/task06_water_balance
  data_dir: ./data/sample/e3sm
  case_name: sample.v3.LR.historical
  basins_file: ./data/sample/obs/basin_polygons.geojson
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  basin_gauges: "3629000,4121801,4115200,6742900,2969100,1159100"
  years: [1985, 1986, 1987, 1988, 1989]

steps:
  # ── Part 1: Extract gridded fields ─────────────────────────────

  - id: extract_precip
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: "RAIN+SNOW"
      years: "${settings.years}"
    outputs:
      field_file: precip_mean.nc

  - id: extract_et
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: "QVEGE+QVEGT+QSOIL"
      years: "${settings.years}"
    outputs:
      field_file: et_mean.nc

  - id: extract_runoff
    tool: extract_gridded_field
    params:
      data_dir: "${settings.data_dir}"
      case_name: "${settings.case_name}"
      component: elm
      variable: QRUNOFF
      years: "${settings.years}"
    outputs:
      field_file: runoff_mean.nc

  # ── Part 2: Global zonal statistics ────────────────────────────

  - id: stats_precip
    tool: compute_zonal_stats
    params:
      field_file: "${extract_precip.outputs.field_file}"
    outputs:
      stats_file: precip_global_stats.csv

  - id: stats_et
    tool: compute_zonal_stats
    params:
      field_file: "${extract_et.outputs.field_file}"
    outputs:
      stats_file: et_global_stats.csv

  - id: stats_runoff
    tool: compute_zonal_stats
    params:
      field_file: "${extract_runoff.outputs.field_file}"
    outputs:
      stats_file: runoff_global_stats.csv

  # ── Part 3: Water balance residual ─────────────────────────────

  # Water balance residual: P - ET first, then (P - ET) - Q
  - id: precip_minus_et
    tool: compute_spatial_bias
    params:
      field_a: "${extract_precip.outputs.field_file}"
      field_b: "${extract_et.outputs.field_file}"
    outputs:
      bias_file: p_minus_et.nc
      stats_file: p_minus_et_stats.csv

  - id: water_balance_residual
    tool: compute_spatial_bias
    params:
      field_a: "${precip_minus_et.outputs.bias_file}"
      field_b: "${extract_runoff.outputs.field_file}"
    outputs:
      bias_file: water_balance_residual.nc
      stats_file: water_balance_stats.csv

  # ── Part 4: Clip fields to basin means ─────────────────────────

  - id: clip_precip
    tool: extract_basin_mean
    params:
      field_file: "${extract_precip.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: basin_precip.csv

  - id: clip_et
    tool: extract_basin_mean
    params:
      field_file: "${extract_et.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: basin_et.csv

  - id: clip_runoff
    tool: extract_basin_mean
    params:
      field_file: "${extract_runoff.outputs.field_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: basin_runoff.csv

  - id: clip_residual
    tool: extract_basin_mean
    params:
      field_file: "${water_balance_residual.outputs.bias_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
    outputs:
      basin_means_file: basin_residual.csv

  # ── Part 5: Composite plot ─────────────────────────────────────

  - id: plot_basins
    tool: plot_water_balance_basins
    params:
      residual_file: "${water_balance_residual.outputs.bias_file}"
      basin_precip_file: "${clip_precip.outputs.basin_means_file}"
      basin_et_file: "${clip_et.outputs.basin_means_file}"
      basin_runoff_file: "${clip_runoff.outputs.basin_means_file}"
      basin_residual_file: "${clip_residual.outputs.basin_means_file}"
      basins_file: "${settings.basins_file}"
      gauge_ids: "${settings.basin_gauges}"
      locations_file: "${settings.metadata_file}"
    outputs:
      plot_file: water_balance_basins.png
