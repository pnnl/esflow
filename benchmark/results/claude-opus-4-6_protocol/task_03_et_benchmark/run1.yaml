name: 'ET Benchmark: E3SM ELM vs MODIS (1985–1989)'
description: 'Benchmark E3SM land model evapotranspiration against MODIS satellite

  observations over 1985–1989.  ET from ELM is the sum of QVEGE, QVEGT,

  and QSOIL.  The workflow fetches the MODIS ET dataset from ILAMB,

  extracts time-mean fields for both model and obs, computes the spatial

  bias (model − obs), reports global statistics, and produces a bias map.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-opus-4-6_protocol/task_03_et_benchmark/run1_output
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: ${settings.output_dir}/modis_et_raw.nc
- id: extract_model_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: ${settings.output_dir}/elm_et_mean.nc
- id: extract_obs_et
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years: ${settings.years}
  outputs:
    field_file: ${settings.output_dir}/modis_et_mean.nc
- id: compute_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et.outputs.field_file}
    field_b: ${extract_obs_et.outputs.field_file}
  outputs:
    bias_file: ${settings.output_dir}/et_bias.nc
    stats_file: ${settings.output_dir}/et_bias_stats.csv
- id: compute_global_stats
  tool: compute_zonal_stats
  params:
    field_file: ${compute_bias.outputs.bias_file}
  outputs:
    stats_file: ${settings.output_dir}/et_bias_global_stats.csv
- id: plot_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_bias.outputs.bias_file}
    title: ET Bias (E3SM ELM − MODIS) 1985–1989
    units: mm/day
    stats_file: ${compute_bias.outputs.stats_file}
  outputs:
    plot_file: ${settings.output_dir}/et_bias_map.png
- id: plot_three_panel
  tool: plot_bias_comparison
  params:
    obs_file: ${extract_obs_et.outputs.field_file}
    sim_file: ${extract_model_et.outputs.field_file}
    bias_file: ${compute_bias.outputs.bias_file}
    obs_label: MODIS ET
    sim_label: E3SM ELM ET (QVEGE+QVEGT+QSOIL)
    bias_label: Bias (ELM − MODIS)
    time_range: 1985-1989
    units: mm/day
    stats_file: ${compute_bias.outputs.stats_file}
  outputs:
    plot_file: ${settings.output_dir}/et_bias_comparison.png
