name: ELM Climatological Mean Runoff (1985-1989)
description: 'Extract the time-mean QRUNOFF field from E3SM/ELM monthly output over
  1985-1989,

  compute area-weighted global mean statistics, and produce a map with statistics
  overlaid.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-opus-4-6_protocol/task_02_seasonal_runoff/run2_output
  component: elm
  variable: QRUNOFF
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
steps:
- id: extract_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.variable}
    years: ${settings.years}
  outputs:
    field_file: elm_qrunoff_mean_1985_1989.nc
- id: compute_global_stats
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    variable: ${settings.variable}
    lat_bands: ''
  outputs:
    stats_file: global_mean_runoff_stats.csv
- id: plot_runoff_map
  tool: plot_gridded_map
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    variable: ${settings.variable}
    title: ELM Mean Runoff (QRUNOFF) 1985-1989
    units: mm/s
    stats_file: ${compute_global_stats.outputs.stats_file}
  outputs:
    plot_file: elm_qrunoff_map_1985_1989.png
