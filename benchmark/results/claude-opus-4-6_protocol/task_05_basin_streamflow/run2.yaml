name: Basin-Scale Streamflow Analysis
description: 'Basin-scale streamflow validation for six major river basins (Amazon,
  Missouri,

  Columbia, Danube, Mekong, Orange) over 1985-1989. Matches gauges to the E3SM

  MOSART grid, extracts simulated and observed discharge, computes validation

  metrics (NSE, KGE, PBIAS, RMSE), and produces per-basin figures with drainage

  basin maps and sim-vs-obs time series.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  obs_dir: ./data/sample/obs/streamflow/
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  basins_file: ./data/sample/obs/basin_polygons.geojson
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-opus-4-6_protocol/task_05_basin_streamflow/run2_output
  component: mosart
  variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.metadata_file}
  outputs:
    metadata_file: ${settings.output_dir}/gauge_metadata_validated.csv
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
  outputs:
    matched_file: ${settings.output_dir}/matched_gauges.csv
- id: extract_sim
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.variable}
    locations_file: ${match_gauges.outputs.matched_file}
    years: ${settings.years}
    frequency: monthly
  outputs:
    timeseries_file: ${settings.output_dir}/sim_discharge.csv
- id: extract_obs
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: ${settings.output_dir}/obs_discharge.csv
- id: compute_validation_metrics
  tool: compute_metrics
  params:
    sim_file: ${extract_sim.outputs.timeseries_file}
    obs_file: ${extract_obs.outputs.timeseries_file}
  outputs:
    metrics_file: ${settings.output_dir}/validation_metrics.csv
- id: plot_metric_map
  tool: plot_map
  params:
    metrics_file: ${compute_validation_metrics.outputs.metrics_file}
    locations_file: ${match_gauges.outputs.matched_file}
    metric: kge
  outputs:
    plot_file: ${settings.output_dir}/map_kge.png
- id: plot_basins
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim.outputs.timeseries_file}
    obs_file: ${extract_obs.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: ${settings.gauge_ids}
    metrics_file: ${compute_validation_metrics.outputs.metrics_file}
  outputs:
    plot_files: ${settings.output_dir}/basin_figures/
