name: 'ET Benchmark: ELM vs MODIS (1985-1989)'
description: 'Benchmark E3SM ELM evapotranspiration against MODIS observations using
  a 5-year

  climatology (1985-1989). Fetch MODIS ET, extract time-mean ET from ELM (QVEGE+QVEGT+QSOIL)

  and MODIS, compute spatial bias (model minus obs) with global stats, and plot the
  bias map.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_03_et_benchmark/run2_output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: modis_et_obs.nc
- id: extract_model_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_et_mean_1985_1989.nc
- id: extract_modis_et_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: obs_et_mean_1985_1989.nc
- id: compute_spatial_bias_et
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et_field.outputs.field_file}
    field_b: ${extract_modis_et_field.outputs.field_file}
  outputs:
    bias_file: et_bias_model_minus_modis.nc
    stats_file: et_bias_stats.csv
- id: plot_bias_et_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_spatial_bias_et.outputs.bias_file}
    title: ELM − MODIS ET Bias (1985–1989 mean)
    units: ''
    stats_file: ${compute_spatial_bias_et.outputs.stats_file}
  outputs:
    plot_file: et_bias_map.png
