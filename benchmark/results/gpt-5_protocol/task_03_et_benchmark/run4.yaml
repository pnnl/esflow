name: ET Benchmark vs MODIS (1985-1989)
description: "Benchmark E3SM ELM evapotranspiration against MODIS (ILAMB) using the\
  \ 5-year climatology from 1985-1989. \nSteps: fetch MODIS ET, extract time-mean\
  \ ET for model (QVEGE+QVEGT+QSOIL) and observations, compute spatial bias (model\
  \ − obs), \nsave bias stats (global mean bias, RMSE, spatial correlation), and plot\
  \ the bias map.\n"
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_03_et_benchmark/run4_output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: modis_et_ilamb.nc
- id: extract_model_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_et_1985-1989.nc
- id: extract_obs_et_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: obs_modis_et_1985-1989.nc
- id: compute_et_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et_field.outputs.field_file}
    field_b: ${extract_obs_et_field.outputs.field_file}
  outputs:
    bias_file: et_bias_model_minus_obs_1985-1989.nc
    stats_file: et_bias_stats_1985-1989.csv
- id: plot_et_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_et_bias.outputs.bias_file}
    title: ELM − MODIS ET Bias (1985–1989)
    units: ''
  outputs:
    plot_file: et_bias_map_1985-1989.png
