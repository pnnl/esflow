name: Integrated Water Cycle Diagnostic (1985-1989) — Six Major Basins
description: 'End-to-end workflow to evaluate E3SM per-basin water cycle over 1985-1989
  across six major basins (Amazon, Missouri, Columbia, Danube, Mekong, Orange). Extracts
  model and observation fields, computes basin means, derives streamflow FDC metrics,
  combines into a basin budget table, and produces comparison and radar plots.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_07_integrated_diagnostic/run3_output
  style: cream_ink
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata: ./data/sample/obs/gauge_metadata.csv
  obs_streamflow_dir: ./data/sample/obs/streamflow
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
steps:
- id: fetch_obs_pr
  tool: fetch_ilamb_data
  params:
    variable: pr
    dataset: GPCCv2018
  outputs:
    data_file: obs_pr_gpccv2018.nc
- id: fetch_obs_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: obs_et_modis.nc
- id: fetch_obs_runoff
  tool: fetch_ilamb_data
  params:
    variable: mrro
    dataset: LORA
  outputs:
    data_file: obs_runoff_lora.nc
- id: extract_model_p
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years: ${settings.years}
  outputs:
    field_file: model_P_mean_1985-1989.nc
- id: extract_model_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: model_ET_mean_1985-1989.nc
- id: extract_model_q
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: model_Q_mean_1985-1989.nc
- id: extract_obs_p_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_pr.outputs.data_file}
    variable: pr
    years: ${settings.years}
  outputs:
    field_file: obs_P_mean_1985-1989.nc
- id: extract_obs_et_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_et.outputs.data_file}
    variable: et
    years: ${settings.years}
  outputs:
    field_file: obs_ET_mean_1985-1989.nc
- id: extract_obs_runoff_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_runoff.outputs.data_file}
    variable: mrro
    years: ${settings.years}
  outputs:
    field_file: obs_Q_mean_1985-1989.nc
- id: m_basin_p
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_p.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_model_P_mean_1985-1989.csv
- id: m_basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_et.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_model_ET_mean_1985-1989.csv
- id: m_basin_q
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_q.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_model_Q_mean_1985-1989.csv
- id: o_basin_p
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_p_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_obs_P_mean_1985-1989.csv
- id: o_basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_et_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_obs_ET_mean_1985-1989.csv
- id: o_basin_q
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_runoff_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basins_obs_Q_mean_1985-1989.csv
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata}
  outputs:
    metadata_file: validated_gauge_metadata.csv
    n_gauges: n_gauges.txt
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges_mosart.csv
    n_matched: n_matched.txt
- id: extract_sim_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges.outputs.matched_file}
    years: ${settings.years}
    frequency: monthly
  outputs:
    timeseries_file: sim_discharge_1985-1989.csv
    n_locations: n_sim_locs.txt
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_streamflow_dir}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_discharge_1985-1989.csv
    n_gauges: n_obs_gauges.txt
- id: compute_fdc
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics_1985-1989.csv
    fdc_file: fdc_data_1985-1989.csv
- id: combine_budget
  tool: compute_basin_budget
  params:
    model_precip_file: ${m_basin_p.outputs.basin_means_file}
    model_et_file: ${m_basin_et.outputs.basin_means_file}
    model_runoff_file: ${m_basin_q.outputs.basin_means_file}
    obs_precip_file: ${o_basin_p.outputs.basin_means_file}
    obs_et_file: ${o_basin_et.outputs.basin_means_file}
    obs_runoff_file: ${o_basin_q.outputs.basin_means_file}
    fdc_metrics_file: ${compute_fdc.outputs.metrics_file}
    locations_file: ${load_metadata.outputs.metadata_file}
  outputs:
    budget_file: basin_budget_summary_1985-1989.csv
- id: plot_budget_bars
  tool: plot_basin_budget_comparison
  params:
    budget_file: ${combine_budget.outputs.budget_file}
  outputs:
    plot_file: plot_basin_budget_comparison_1985-1989.png
- id: plot_budget_radar
  tool: plot_basin_radar
  params:
    budget_file: ${combine_budget.outputs.budget_file}
  outputs:
    plot_file: plot_basin_radar_1985-1989.png
