name: Integrated Basin Water Cycle Evaluation 1985-1989
description: 'End-to-end workflow to evaluate E3SM per-basin integrated water cycle
  over 1985-1989

  for six major river basins (Amazon, Missouri, Columbia, Danube, Mekong, Orange).

  Extracts model climatological P, ET, Q from ELM; fetches ILAMB observations (GPCC,

  MODIS, LORA) and extracts climatologies; computes basin-averaged means; matches

  gauges to MOSART grid to extract discharge and compute FDC metrics; combines into

  a basin budget summary; and produces comparative bar charts and radar diagnostics.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_07_integrated_diagnostic/run1_output
  style: cream_ink
steps:
- id: extract_model_precip_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_P_1985-1989.nc
- id: extract_model_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_ET_1985-1989.nc
- id: extract_model_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_Q_1985-1989.nc
- id: fetch_obs_pr_gpcc
  tool: fetch_ilamb_data
  params:
    variable: pr
    dataset: GPCCv2018
  outputs:
    data_file: ilamb_pr_gpcc.nc
- id: fetch_obs_et_modis
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: ilamb_et_modis.nc
- id: fetch_obs_runoff_lora
  tool: fetch_ilamb_data
  params:
    variable: mrro
    dataset: LORA
  outputs:
    data_file: ilamb_mrro_lora.nc
- id: extract_obs_precip_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_pr_gpcc.outputs.data_file}
    variable: pr
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: obs_P_1985-1989.nc
- id: extract_obs_et_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_et_modis.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: obs_ET_1985-1989.nc
- id: extract_obs_runoff_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_runoff_lora.outputs.data_file}
    variable: mrro
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: obs_Q_1985-1989.nc
- id: basin_means_model_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_precip_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_model_P.csv
- id: basin_means_model_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_et_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_model_ET.csv
- id: basin_means_model_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_runoff_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_model_Q.csv
- id: basin_means_obs_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_precip_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_obs_P.csv
- id: basin_means_obs_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_et_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_obs_ET.csv
- id: basin_means_obs_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_runoff_field.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: basin_obs_Q.csv
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    metadata_file: validated_gauge_metadata.csv
    n_gauges: gauges_loaded.count
- id: match_gauges_to_mosart
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges_mosart.csv
    n_matched: n_matched.count
- id: extract_simulated_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges_to_mosart.outputs.matched_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    timeseries_file: sim_discharge_1985-1989.csv
    n_locations: n_locations.count
- id: extract_observed_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ./data/sample/obs/streamflow/
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_discharge_1985-1989.csv
    n_gauges: n_obs_gauges.count
- id: compute_fdc_metrics_basin_streamflow
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_simulated_discharge.outputs.timeseries_file}
    obs_file: ${extract_observed_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics_1985-1989.csv
    fdc_file: fdc_percentiles_1985-1989.csv
- id: assemble_basin_budget_summary
  tool: compute_basin_budget
  params:
    model_precip_file: ${basin_means_model_precip.outputs.basin_means_file}
    model_et_file: ${basin_means_model_et.outputs.basin_means_file}
    model_runoff_file: ${basin_means_model_runoff.outputs.basin_means_file}
    obs_precip_file: ${basin_means_obs_precip.outputs.basin_means_file}
    obs_et_file: ${basin_means_obs_et.outputs.basin_means_file}
    obs_runoff_file: ${basin_means_obs_runoff.outputs.basin_means_file}
    fdc_metrics_file: ${compute_fdc_metrics_basin_streamflow.outputs.metrics_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
  outputs:
    budget_file: basin_budget_summary_1985-1989.csv
- id: plot_basin_budget_barchart
  tool: plot_basin_budget_comparison
  params:
    budget_file: ${assemble_basin_budget_summary.outputs.budget_file}
  outputs:
    plot_file: basin_budget_comparison_1985-1989.png
- id: plot_basin_radar_diagnostics
  tool: plot_basin_radar
  params:
    budget_file: ${assemble_basin_budget_summary.outputs.budget_file}
  outputs:
    plot_file: basin_radar_diagnostics_1985-1989.png
