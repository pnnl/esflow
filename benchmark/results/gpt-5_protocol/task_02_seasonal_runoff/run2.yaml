name: ELM Runoff 1985-1989 Climatology
description: 'Extract the E3SM ELM QRUNOFF field for 1985-1989, compute the area-weighted
  global mean, and plot the mean runoff map with global statistics overlaid.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_02_seasonal_runoff/run2_output
  style: cream_ink
steps:
- id: extract_qrunoff_1985_1989
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: qrunoff_mean_1985_1989.nc
- id: compute_global_mean_qrunoff
  tool: compute_zonal_stats
  params:
    field_file: ${extract_qrunoff_1985_1989.outputs.field_file}
    variable: ''
    lat_bands: ''
  outputs:
    stats_file: qrunoff_global_mean_1985_1989.csv
- id: plot_qrunoff_map
  tool: plot_gridded_map
  params:
    field_file: ${extract_qrunoff_1985_1989.outputs.field_file}
    variable: ''
    title: Mean QRUNOFF 1985-1989
    units: ''
    stats_file: ${compute_global_mean_qrunoff.outputs.stats_file}
  outputs:
    plot_file: qrunoff_mean_1985_1989_map.png
