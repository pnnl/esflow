name: ELM Water Balance Closure 1985-1989
description: 'Extract climatological time-mean ELM fields for precipitation (RAIN+SNOW),
  evapotranspiration (QVEGE+QVEGT+QSOIL), and total runoff (QRUNOFF) for 1985-1989.
  Compute global means, form the residual P − ET − Q as a spatial field, derive basin
  means for six major basins, and produce a composite figure with a global residual
  map and per-basin bar charts.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_06_water_balance/run2_output
  style: cream_ink
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata: ./data/sample/obs/gauge_metadata.csv
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata}
  outputs:
    metadata_file: gauge_metadata_validated.csv
- id: extract_precip_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: precip_field_1985-1989.nc
- id: extract_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: et_field_1985-1989.nc
- id: extract_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: runoff_field_1985-1989.nc
- id: compute_global_mean_precip
  tool: compute_zonal_stats
  params:
    field_file: ${extract_precip_field.outputs.field_file}
  outputs:
    stats_file: precip_global_mean_1985-1989.csv
- id: compute_global_mean_et
  tool: compute_zonal_stats
  params:
    field_file: ${extract_et_field.outputs.field_file}
  outputs:
    stats_file: et_global_mean_1985-1989.csv
- id: compute_global_mean_runoff
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
  outputs:
    stats_file: runoff_global_mean_1985-1989.csv
- id: compute_p_minus_et
  tool: compute_spatial_bias
  params:
    field_a: ${extract_precip_field.outputs.field_file}
    field_b: ${extract_et_field.outputs.field_file}
  outputs:
    bias_file: p_minus_et_field_1985-1989.nc
    stats_file: p_minus_et_bias_stats_1985-1989.csv
- id: compute_residual_field
  tool: compute_spatial_bias
  params:
    field_a: ${compute_p_minus_et.outputs.bias_file}
    field_b: ${extract_runoff_field.outputs.field_file}
  outputs:
    bias_file: residual_field_1985-1989.nc
    stats_file: residual_bias_stats_1985-1989.csv
- id: compute_global_mean_residual
  tool: compute_zonal_stats
  params:
    field_file: ${compute_residual_field.outputs.bias_file}
  outputs:
    stats_file: residual_global_mean_1985-1989.csv
- id: extract_basin_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_precip_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_precip_means_1985-1989.csv
- id: extract_basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_et_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_et_means_1985-1989.csv
- id: extract_basin_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_runoff_means_1985-1989.csv
- id: extract_basin_residual
  tool: extract_basin_mean
  params:
    field_file: ${compute_residual_field.outputs.bias_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_residual_means_1985-1989.csv
- id: plot_water_balance
  tool: plot_water_balance_basins
  params:
    residual_file: ${compute_residual_field.outputs.bias_file}
    basin_precip_file: ${extract_basin_precip.outputs.basin_means_file}
    basin_et_file: ${extract_basin_et.outputs.basin_means_file}
    basin_runoff_file: ${extract_basin_runoff.outputs.basin_means_file}
    basin_residual_file: ${extract_basin_residual.outputs.basin_means_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
  outputs:
    plot_file: water_balance_composite_1985-1989.png
