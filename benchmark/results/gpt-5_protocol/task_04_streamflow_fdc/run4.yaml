name: Streamflow FDC 1985-1989 Distribution Comparison
description: 'Match GRDC gauges to E3SM MOSART grid, extract daily discharge for 1985-1989

  from simulation and observations, compute flow duration curve (FDC) distributional

  metrics (volume bias, Wasserstein distance, and Q10/Q50/Q90 ratios), save metrics

  and FDC percentile CSVs, and plot a Wasserstein distance map with FDC panels for

  selected major rivers.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_04_streamflow_fdc/run4_output
  style: cream_ink
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    metadata_file: ${settings.output_dir}/gauge_metadata.validated.csv
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: ${settings.output_dir}/gauges.matched.csv
- id: extract_sim_timeseries
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges.outputs.matched_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    frequency: daily
  outputs:
    timeseries_file: ${settings.output_dir}/sim_discharge_daily_1985-1989.csv
- id: extract_obs_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ./data/sample/obs/streamflow/
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    timeseries_file: ${settings.output_dir}/obs_discharge_daily_1985-1989.csv
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_sim_timeseries.outputs.timeseries_file}
    obs_file: ${extract_obs_timeseries.outputs.timeseries_file}
  outputs:
    metrics_file: ${settings.output_dir}/fdc_metrics_1985-1989.csv
    fdc_file: ${settings.output_dir}/fdc_percentiles_1985-1989.csv
- id: plot_fdc
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    metric: wasserstein
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    plot_file: ${settings.output_dir}/fdc_wasserstein_map_panels.png
