name: Task05 Basin Streamflow Analysis (1985-1989)
description: "Basin-scale streamflow analysis for six major river basins over 1985-1989.\n\
  Steps:\n- Validate gauge metadata and match gauges to E3SM MOSART grid\n- Extract\
  \ simulated (MOSART) and observed discharge time series for 1985-1989\n- Compute\
  \ validation metrics (RMSE, NSE, KGE, PBIAS) between simulations and observations\n\
  - Produce per-basin figures with basin boundary maps and sim-vs-obs time series\
  \ for:\n  Amazon (3629000), Missouri (4121801), Columbia (4115200), Danube (6742900),\
  \ Mekong (2969100), Orange (1159100)\n"
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gpt-5_protocol/task_05_basin_streamflow/run4_output
  style: cream_ink
  obs_dir: ./data/sample/obs/streamflow
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  basins_file: ./data/sample/obs/basin_polygons.geojson
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.metadata_file}
  outputs:
    metadata_file: gauge_metadata.validated.csv
    n_gauges: n_gauges.txt
- id: match_gauges_to_mosart
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges.mosart.csv
    n_matched: n_matched.txt
- id: extract_simulated_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges_to_mosart.outputs.matched_file}
    years: ${settings.years}
  outputs:
    timeseries_file: sim_discharge_1985-1989.csv
    n_locations: n_sim_locations.txt
- id: extract_observed_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_discharge_1985-1989.csv
    n_gauges: n_obs_gauges.txt
- id: compute_validation_metrics
  tool: compute_metrics
  params:
    sim_file: ${extract_simulated_discharge.outputs.timeseries_file}
    obs_file: ${extract_observed_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: metrics_sim_vs_obs_1985-1989.csv
    n_gauges: n_metrics_gauges.txt
- id: plot_basin_figures
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_simulated_discharge.outputs.timeseries_file}
    obs_file: ${extract_observed_discharge.outputs.timeseries_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    gauge_ids: ${settings.gauge_ids}
    metrics_file: ${compute_validation_metrics.outputs.metrics_file}
  outputs:
    plot_files: basin_timeseries_plots.json
