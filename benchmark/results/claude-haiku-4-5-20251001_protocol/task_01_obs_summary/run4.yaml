name: 'Task 01: Observation Summary Statistics'
description: 'Load GRDC gauge metadata, extract monthly streamflow observations for
  six major

  river basins (1985-1989), and compute summary statistics (mean, std, min, max)

  for each gauge.

  '
settings:
  case_name: task01_obs
  data_dir: ./data/sample/obs
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-haiku-4-5-20251001_protocol/task_01_obs_summary/run4_output
steps:
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    metadata_file: gauge_metadata.csv
- id: extract_obs_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ./data/sample/obs/streamflow
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_streamflow_1985_1989.csv
- id: compute_summary_stats
  tool: compute_summary_stats
  params:
    timeseries_file: ${extract_obs_timeseries.outputs.timeseries_file}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    top_n: 0
    rank_by: mean
  outputs:
    stats_file: obs_summary_statistics.csv
