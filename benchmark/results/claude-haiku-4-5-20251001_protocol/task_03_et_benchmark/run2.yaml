name: E3SM ELM Evapotranspiration Benchmark against MODIS
description: 'Benchmark E3SM land model evapotranspiration against MODIS satellite
  observations.

  Fetches MODIS ET data from ILAMB, extracts 5-year climatological means (1985-1989)

  from both E3SM ELM output and MODIS observations, computes spatial bias, and produces

  a bias map with global statistics.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-haiku-4-5-20251001_protocol/task_03_et_benchmark/run2_output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: modis_et_raw.nc
- id: extract_elm_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: elm_et_mean.nc
- id: extract_modis_et
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: modis_et_mean.nc
- id: compute_et_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_elm_et.outputs.field_file}
    field_b: ${extract_modis_et.outputs.field_file}
  outputs:
    bias_file: et_bias.nc
    stats_file: et_bias_stats.csv
- id: plot_et_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_et_bias.outputs.bias_file}
    variable: bias
    title: E3SM ELM ET Bias (Model − MODIS) 1985-1989
    units: mm/day
    stats_file: ${compute_et_bias.outputs.stats_file}
  outputs:
    plot_file: et_bias_map.png
