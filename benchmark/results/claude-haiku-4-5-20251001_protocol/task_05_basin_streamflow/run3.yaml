name: Basin-Scale Streamflow Analysis for Six Major Rivers
description: 'Performs a comprehensive basin-scale streamflow analysis for six major
  river basins

  over 1985-1989. Matches gauges to E3SM MOSART grid, extracts simulated and observed

  discharge time series, computes validation metrics (RMSE, NSE, KGE, PBIAS), and

  produces per-basin figures showing drainage basin boundaries and sim-vs-obs comparisons.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  obs_dir: ./data/sample/obs/streamflow
  metadata_file: ./data/sample/obs/gauge_metadata.csv
  basins_file: ./data/sample/obs/basin_polygons.geojson
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-haiku-4-5-20251001_protocol/task_05_basin_streamflow/run3_output
  component: mosart
  variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.metadata_file}
  outputs:
    metadata_file: gauge_metadata.csv
    n_gauges: n_gauges.txt
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
  outputs:
    matched_file: matched_gauges.csv
    n_matched: n_matched.txt
- id: extract_sim_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.variable}
    locations_file: ${match_gauges.outputs.matched_file}
    years: ${settings.years}
    frequency: monthly
  outputs:
    timeseries_file: sim_discharge_timeseries.csv
    n_locations: n_locations.txt
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_discharge_timeseries.csv
    n_gauges: n_obs_gauges.txt
- id: compute_metrics
  tool: compute_metrics
  params:
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: validation_metrics.csv
    n_gauges: n_metrics_gauges.txt
- id: plot_basin_amazon
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '3629000'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: amazon_basin_plot.png
- id: plot_basin_missouri
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '4121801'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: missouri_basin_plot.png
- id: plot_basin_columbia
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '4115200'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: columbia_basin_plot.png
- id: plot_basin_danube
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '6742900'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: danube_basin_plot.png
- id: plot_basin_mekong
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '2969100'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: mekong_basin_plot.png
- id: plot_basin_orange
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
    locations_file: ${load_metadata.outputs.metadata_file}
    gauge_ids: '1159100'
    metrics_file: ${compute_metrics.outputs.metrics_file}
  outputs:
    plot_files: orange_basin_plot.png
