name: E3SM River Discharge FDC Distribution Analysis
description: "Compare E3SM MOSART simulated river discharge against observations using\
  \ flow duration curve (FDC) \ndistributional metrics for 1985-1989. Matches gauges\
  \ to model grid, extracts daily discharge time series, \ncomputes FDC metrics (volume\
  \ bias, Wasserstein distance, quantile ratios), and produces a map with \nFDC comparison\
  \ panels for six major river basins.\n"
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  obs_dir: ./data/sample/obs/streamflow
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-haiku-4-5-20251001_protocol/task_04_streamflow_fdc/run2_output
  gauge_metadata: ./data/sample/obs/gauge_metadata.csv
  component: mosart
  variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  frequency: daily
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata}
  outputs:
    metadata_file: gauge_metadata.csv
    n_gauges: n_gauges.txt
- id: match_gauges_to_grid
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
  outputs:
    matched_file: matched_gauges.csv
    n_matched: n_matched.txt
- id: extract_sim_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.variable}
    locations_file: ${match_gauges_to_grid.outputs.matched_file}
    years: ${settings.years}
    frequency: ${settings.frequency}
  outputs:
    timeseries_file: sim_discharge_daily.csv
    n_locations: n_sim_locations.txt
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_discharge_daily.csv
    n_gauges: n_obs_gauges.txt
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_sim_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics.csv
    fdc_file: fdc_percentiles.csv
- id: plot_fdc_comparison
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    metric: wasserstein
    gauge_ids: ${settings.gauge_ids}
  outputs:
    plot_file: fdc_comparison_map_and_panels.png
