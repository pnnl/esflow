name: E3SM Per-Basin Integrated Water Cycle Evaluation (1985-1989)
description: 'Comprehensive per-basin water cycle evaluation for E3SM over 1985-1989.

  Extracts model fields (P, ET, Q) from ELM, fetches and extracts observation fields
  from ILAMB,

  clips to basin means for six major river basins, computes streamflow FDC metrics,

  and produces integrated diagnostics including budget comparison and radar charts.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  obs_dir: ./data/sample/obs
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/claude-haiku-4-5-20251001_protocol/task_07_integrated_diagnostic/run1_output
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata: ./data/sample/obs/gauge_metadata.csv
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: extract_model_precip
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years: ${settings.years}
  outputs:
    field_file: model_precip_1985_1989.nc
- id: extract_model_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: model_et_1985_1989.nc
- id: extract_model_runoff
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: model_runoff_1985_1989.nc
- id: fetch_obs_precip
  tool: fetch_ilamb_data
  params:
    variable: pr
    dataset: GPCCv2018
  outputs:
    data_file: obs_precip_gpcc.nc
- id: extract_obs_precip
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_precip.outputs.data_file}
    variable: pr
    years: ${settings.years}
  outputs:
    field_file: obs_precip_1985_1989.nc
- id: fetch_obs_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: obs_et_modis.nc
- id: extract_obs_et
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_et.outputs.data_file}
    variable: et
    years: ${settings.years}
  outputs:
    field_file: obs_et_1985_1989.nc
- id: fetch_obs_runoff
  tool: fetch_ilamb_data
  params:
    variable: mrro
    dataset: LORA
  outputs:
    data_file: obs_runoff_lora.nc
- id: extract_obs_runoff
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_runoff.outputs.data_file}
    variable: mrro
    years: ${settings.years}
  outputs:
    field_file: obs_runoff_1985_1989.nc
- id: clip_model_precip_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_precip.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: model_precip_basin_means.csv
- id: clip_model_et_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_et.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: model_et_basin_means.csv
- id: clip_model_runoff_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_runoff.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: model_runoff_basin_means.csv
- id: clip_obs_precip_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_precip.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: obs_precip_basin_means.csv
- id: clip_obs_et_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_et.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: obs_et_basin_means.csv
- id: clip_obs_runoff_basins
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_runoff.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: obs_runoff_basin_means.csv
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata}
  outputs:
    metadata_file: gauge_metadata_validated.csv
    n_gauges: 6
- id: match_gauges_to_mosart
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges_mosart.csv
    n_matched: 6
- id: extract_model_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges_to_mosart.outputs.matched_file}
    years: ${settings.years}
    frequency: monthly
  outputs:
    timeseries_file: model_discharge_1985_1989.csv
    n_locations: 6
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}/streamflow
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_discharge_1985_1989.csv
    n_gauges: 6
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_model_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics.csv
    fdc_file: fdc_percentiles.csv
- id: compute_water_balance_residual
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW-QVEGE-QVEGT-QSOIL-QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: model_residual_1985_1989.nc
- id: clip_residual_basins
  tool: extract_basin_mean
  params:
    field_file: ${compute_water_balance_residual.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: model_residual_basin_means.csv
- id: compute_basin_budget
  tool: compute_basin_budget
  params:
    model_precip_file: ${clip_model_precip_basins.outputs.basin_means_file}
    model_et_file: ${clip_model_et_basins.outputs.basin_means_file}
    model_runoff_file: ${clip_model_runoff_basins.outputs.basin_means_file}
    obs_precip_file: ${clip_obs_precip_basins.outputs.basin_means_file}
    obs_et_file: ${clip_obs_et_basins.outputs.basin_means_file}
    obs_runoff_file: ${clip_obs_runoff_basins.outputs.basin_means_file}
    fdc_metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
  outputs:
    budget_file: basin_budget_summary.csv
- id: plot_budget_comparison
  tool: plot_basin_budget_comparison
  params:
    budget_file: ${compute_basin_budget.outputs.budget_file}
  outputs:
    plot_file: basin_budget_comparison.png
- id: plot_radar_diagnostics
  tool: plot_basin_radar
  params:
    budget_file: ${compute_basin_budget.outputs.budget_file}
  outputs:
    plot_file: basin_radar_diagnostics.png
- id: plot_fdc_comparison
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    metric: wasserstein
    n_panels: 6
  outputs:
    plot_file: fdc_comparison.png
