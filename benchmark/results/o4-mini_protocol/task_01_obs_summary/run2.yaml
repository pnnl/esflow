name: Task01 Observation Streamflow Summary
description: 'Loads GRDC gauge metadata and extracts monthly streamflow observations
  for six selected gauges from 1985 to 1989,

  then computes summary statistics (mean, std, min, max) for each gauge.

  '
settings:
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_01_obs_summary/run2_output
  style: cream_ink
steps:
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    metadata_file: validated_gauge_metadata.csv
    n_gauges: validated_n_gauges.txt
- id: extract_obs_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ./data/sample/obs/streamflow/
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_timeseries_1985_1989.csv
    n_gauges: obs_n_gauges.txt
- id: compute_summary
  tool: compute_summary_stats
  params:
    timeseries_file: ${extract_obs_timeseries.outputs.timeseries_file}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
  outputs:
    stats_file: obs_summary_stats.csv
    n_columns: summary_n_columns.txt
