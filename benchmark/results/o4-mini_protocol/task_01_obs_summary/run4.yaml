name: Observational Streamflow Summary
description: 'Load GRDC gauge metadata, extract monthly streamflow observations for
  selected gauges from 1985 to 1989, and compute summary statistics.

  '
settings:
  case_name: task01
  data_dir: ./data/sample
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_01_obs_summary/run4_output
  style: cream_ink
steps:
- id: load_obs_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.data_dir}/obs/gauge_metadata.csv
  outputs:
    metadata_file: gauge_metadata_valid.csv
    n_gauges: n_gauges
- id: extract_obs_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.data_dir}/obs/streamflow
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_streamflow_1985_1989.csv
    n_gauges: n_gauges
- id: compute_streamflow_summary
  tool: compute_summary_stats
  params:
    timeseries_file: ${extract_obs_timeseries.outputs.timeseries_file}
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
  outputs:
    stats_file: obs_streamflow_summary_stats.csv
    n_columns: n_columns
