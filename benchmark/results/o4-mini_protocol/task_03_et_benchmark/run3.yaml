name: ET Benchmark ELM vs MODIS 1985-1989
description: 'Benchmark E3SM land model ET against MODIS satellite observations using
  a 5-year climatology (1985-1989).

  Fetch MODIS ET from ILAMB, extract climatological means from MODIS and ELM output,
  compute spatial bias,

  and plot the bias field map.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_03_et_benchmark/run3_output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: modis_et.nc
- id: extract_obs_et_clim
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: modis_et_clim.nc
- id: extract_model_et_clim
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: model_et_clim.nc
- id: compute_et_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et_clim.outputs.field_file}
    field_b: ${extract_obs_et_clim.outputs.field_file}
  outputs:
    bias_file: et_bias.nc
    stats_file: et_bias_stats.csv
- id: plot_et_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_et_bias.outputs.bias_file}
    title: ET Bias (ELM - MODIS) 1985-1989
  outputs:
    plot_file: et_bias_map.png
