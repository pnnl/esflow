name: ET Benchmark ELM vs MODIS 1985-1989
description: 'Benchmark E3SM land model evapotranspiration against MODIS satellite

  observations using 5-year climatology from 1985-1989. Fetch MODIS ET data,

  extract time-mean fields for model and observations, compute spatial bias

  and global statistics, and produce a bias map.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_03_et_benchmark/run1_debug/v1/output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: modis_et.nc
- id: extract_model_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: elm_et_climatology_1985-1989.nc
- id: extract_obs_et
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: modis_et_climatology_1985-1989.nc
- id: compute_et_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et.outputs.field_file}
    field_b: ${extract_obs_et.outputs.field_file}
  outputs:
    bias_file: et_bias_elm_minus_modis.nc
    stats_file: et_bias_stats.csv
- id: plot_et_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_et_bias.outputs.bias_file}
    stats_file: ${compute_et_bias.outputs.stats_file}
    variable: bias
    title: ELM ET Bias vs MODIS (1985-1989)
  outputs:
    plot_file: et_bias_map.png
