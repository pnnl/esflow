name: Task06 Water Balance Closure
description: 'Extract climatological mean fields of precipitation, evapotranspiration,
  and runoff

  from ELM output for 1985-1989, compute global means, derive the water balance

  residual, clip to six major basins, and produce a composite water balance figure.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_06_water_balance/run4_output
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata_file: ./data/sample/obs/gauge_metadata.csv
  years:
  - 1985
  - 1989
  basin_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: extract_precip
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years: ${settings.years}
  outputs:
    field_file: precip_field.nc
- id: extract_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: et_field.nc
- id: extract_runoff
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: runoff_field.nc
- id: compute_global_precip
  tool: compute_zonal_stats
  params:
    field_file: ${extract_precip.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: global_precip_stats.csv
- id: compute_global_et
  tool: compute_zonal_stats
  params:
    field_file: ${extract_et.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: global_et_stats.csv
- id: compute_global_runoff
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: global_runoff_stats.csv
- id: compute_p_minus_et
  tool: compute_spatial_bias
  params:
    field_a: ${extract_precip.outputs.field_file}
    field_b: ${extract_et.outputs.field_file}
  outputs:
    bias_file: p_minus_et.nc
    stats_file: p_minus_et_stats.csv
- id: compute_residual
  tool: compute_spatial_bias
  params:
    field_a: ${compute_p_minus_et.outputs.bias_file}
    field_b: ${extract_runoff.outputs.field_file}
  outputs:
    bias_file: residual_field.nc
    stats_file: residual_stats.csv
- id: extract_basin_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_precip.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.basin_ids}
  outputs:
    basin_means_file: basin_precip.csv
- id: extract_basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_et.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.basin_ids}
  outputs:
    basin_means_file: basin_et.csv
- id: extract_basin_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_runoff.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.basin_ids}
  outputs:
    basin_means_file: basin_runoff.csv
- id: extract_basin_residual
  tool: extract_basin_mean
  params:
    field_file: ${compute_residual.outputs.bias_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.basin_ids}
  outputs:
    basin_means_file: basin_residual.csv
- id: plot_water_balance
  tool: plot_water_balance_basins
  params:
    residual_file: ${compute_residual.outputs.bias_file}
    basin_precip_file: ${extract_basin_precip.outputs.basin_means_file}
    basin_et_file: ${extract_basin_et.outputs.basin_means_file}
    basin_runoff_file: ${extract_basin_runoff.outputs.basin_means_file}
    basin_residual_file: ${extract_basin_residual.outputs.basin_means_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.basin_ids}
    locations_file: ${settings.gauge_metadata_file}
  outputs:
    plot_file: water_balance_basins.png
