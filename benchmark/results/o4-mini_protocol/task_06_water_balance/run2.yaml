name: Water Balance Closure in ELM (1985-1989)
description: 'Workflow to check E3SM land model water balance closure using monthly
  ELM output for 1985-1989.

  Extracts climatological time-mean fields for precipitation, evapotranspiration,
  and runoff;

  computes global means; computes residual field; extracts per-basin means for six
  major basins;

  and plots a composite water balance figure.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_06_water_balance/run2_output
  style: cream_ink
steps:
- id: extract_precip
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years:
    - 1985
    - 1989
  outputs:
    field_file: p_field.nc
- id: extract_et
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1989
  outputs:
    field_file: et_field.nc
- id: extract_runoff
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1989
  outputs:
    field_file: runoff_field.nc
- id: global_stats_precip
  tool: compute_zonal_stats
  params:
    field_file: ${extract_precip.outputs.field_file}
  outputs:
    stats_file: p_global_stats.csv
- id: global_stats_et
  tool: compute_zonal_stats
  params:
    field_file: ${extract_et.outputs.field_file}
  outputs:
    stats_file: et_global_stats.csv
- id: global_stats_runoff
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff.outputs.field_file}
  outputs:
    stats_file: q_global_stats.csv
- id: bias_p_minus_et
  tool: compute_spatial_bias
  params:
    field_a: ${extract_precip.outputs.field_file}
    field_b: ${extract_et.outputs.field_file}
  outputs:
    bias_file: p_et_diff.nc
    stats_file: p_et_stats.csv
- id: compute_residual
  tool: compute_spatial_bias
  params:
    field_a: ${bias_p_minus_et.outputs.bias_file}
    field_b: ${extract_runoff.outputs.field_file}
  outputs:
    bias_file: residual_field.nc
    stats_file: residual_stats.csv
- id: basin_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_precip.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: p_basin_means.csv
- id: basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_et.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: et_basin_means.csv
- id: basin_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_runoff.outputs.field_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: q_basin_means.csv
- id: basin_residual
  tool: extract_basin_mean
  params:
    field_file: ${compute_residual.outputs.bias_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    basin_means_file: residual_basin_means.csv
- id: plot_water_balance
  tool: plot_water_balance_basins
  params:
    residual_file: ${compute_residual.outputs.bias_file}
    basin_precip_file: ${basin_precip.outputs.basin_means_file}
    basin_et_file: ${basin_et.outputs.basin_means_file}
    basin_runoff_file: ${basin_runoff.outputs.basin_means_file}
    basin_residual_file: ${basin_residual.outputs.basin_means_file}
    basins_file: ./data/sample/obs/basin_polygons.geojson
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
    locations_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    plot_file: water_balance_basins.png
