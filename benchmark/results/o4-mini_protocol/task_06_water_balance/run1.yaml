name: E3SM Land Model Water Balance Closure 1985-1989
description: 'Compute global mean P, ET, and Q from ELM output (1985-1989),

  derive water balance residual, extract basin means for six major basins,

  and plot a composite water balance figure.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_06_water_balance/run1_output
  style: cream_ink
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata: ./data/sample/obs/gauge_metadata.csv
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  years:
  - 1985
  - 1989
  component: elm
steps:
- id: extract_precip_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: RAIN+SNOW
    years: ${settings.years}
  outputs:
    field_file: precip_field.nc
- id: extract_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: et_field.nc
- id: extract_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: runoff_field.nc
- id: global_precip_stats
  tool: compute_zonal_stats
  params:
    field_file: ${extract_precip_field.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: precip_global_stats.csv
- id: global_et_stats
  tool: compute_zonal_stats
  params:
    field_file: ${extract_et_field.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: et_global_stats.csv
- id: global_runoff_stats
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: runoff_global_stats.csv
- id: residual_p_et
  tool: compute_spatial_bias
  params:
    field_a: ${extract_precip_field.outputs.field_file}
    field_b: ${extract_et_field.outputs.field_file}
  outputs:
    bias_file: p_minus_et_field.nc
    stats_file: p_et_stats.csv
- id: compute_total_residual
  tool: compute_spatial_bias
  params:
    field_a: ${residual_p_et.outputs.bias_file}
    field_b: ${extract_runoff_field.outputs.field_file}
  outputs:
    bias_file: residual_field.nc
    stats_file: residual_stats.csv
- id: basin_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_precip_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_precip.csv
- id: basin_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_et_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_et.csv
- id: basin_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_runoff.csv
- id: basin_residual
  tool: extract_basin_mean
  params:
    field_file: ${compute_total_residual.outputs.bias_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_residual.csv
- id: plot_water_balance
  tool: plot_water_balance_basins
  params:
    residual_file: ${compute_total_residual.outputs.bias_file}
    basin_precip_file: ${basin_precip.outputs.basin_means_file}
    basin_et_file: ${basin_et.outputs.basin_means_file}
    basin_runoff_file: ${basin_runoff.outputs.basin_means_file}
    basin_residual_file: ${basin_residual.outputs.basin_means_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
    locations_file: ${settings.gauge_metadata}
  outputs:
    plot_file: water_balance_composite.png
