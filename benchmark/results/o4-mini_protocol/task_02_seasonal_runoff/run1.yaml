name: Seasonal Runoff Climatology 1985-1989
description: 'Extract the time-mean global runoff field from ELM output (1985-1989)

  and compute the area-weighted global mean, then plot the field with

  global statistics overlaid.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_02_seasonal_runoff/run1_output
  style: cream_ink
steps:
- id: extract_runoff
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: runoff_mean.nc
- id: compute_global_mean
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: runoff_global_stats.csv
- id: plot_runoff_map
  tool: plot_gridded_map
  params:
    field_file: ${extract_runoff.outputs.field_file}
    title: Mean Runoff 1985-1989
    stats_file: ${compute_global_mean.outputs.stats_file}
  outputs:
    plot_file: runoff_map.png
