name: Basin-scale Streamflow Analysis 1985-1989
description: 'Perform streamflow analysis for six major river basins over 1985-1989,
  including matching gauges,

  extracting simulated and observed discharge, computing validation metrics, and plotting
  per-basin

  time series figures.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_05_basin_streamflow/run3_output
  style: cream_ink
  obs_metadata: ./data/sample/obs/gauge_metadata.csv
  obs_streamflow_dir: ./data/sample/obs/streamflow
  basins_file: ./data/sample/obs/basin_polygons.geojson
steps:
- id: load_obs_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.obs_metadata}
  outputs:
    metadata_file: validated_metadata.csv
    n_gauges: n_gauges.txt
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges.csv
    n_matched: n_matched.txt
- id: extract_obs_ts
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_streamflow_dir}
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_streamflow_1985_1989.csv
    n_gauges: n_obs_gauges.txt
- id: extract_sim_ts
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges.outputs.matched_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    timeseries_file: sim_streamflow_1985_1989.csv
    n_locations: n_sim_locations.txt
- id: compute_streamflow_metrics
  tool: compute_metrics
  params:
    sim_file: ${extract_sim_ts.outputs.timeseries_file}
    obs_file: ${extract_obs_ts.outputs.timeseries_file}
  outputs:
    metrics_file: streamflow_metrics.csv
    n_gauges: n_metrics_gauges.txt
- id: plot_basin_timeseries
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basins_file}
    sim_file: ${extract_sim_ts.outputs.timeseries_file}
    obs_file: ${extract_obs_ts.outputs.timeseries_file}
    locations_file: ${match_gauges.outputs.matched_file}
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
    metrics_file: ${compute_streamflow_metrics.outputs.metrics_file}
  outputs:
    plot_files: basin_streamflow_plots
