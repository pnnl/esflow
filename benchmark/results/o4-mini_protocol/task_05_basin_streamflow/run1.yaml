name: Basin-scale Streamflow Analysis 1985-1989
description: 'This workflow matches gauges, extracts model and observation streamflow
  time series for the period 1985-1989, computes validation metrics, and generates
  per-basin streamflow time series plots for six major river basins.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm
  obs_metadata_file: ./data/sample/obs/gauge_metadata.csv
  obs_streamflow_dir: ./data/sample/obs/streamflow
  basin_polygons: ./data/sample/obs/basin_polygons.geojson
  basin_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/o4-mini_protocol/task_05_basin_streamflow/run1_output
  style: cream_ink
steps:
- id: load_obs_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.obs_metadata_file}
  outputs:
    metadata_file: validated_gauge_metadata.csv
    n_gauges: n_gauges
- id: match_gauges
  tool: match_to_grid
  params:
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_gauges.csv
    n_matched: n_matched
- id: extract_model_streamflow
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges.outputs.matched_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    timeseries_file: sim_streamflow.csv
    n_locations: n_sim_locations
- id: extract_observed_streamflow
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_streamflow_dir}
    gauge_metadata: ${load_obs_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    timeseries_file: obs_streamflow.csv
    n_gauges: n_obs_gauges
- id: compute_streamflow_metrics
  tool: compute_metrics
  params:
    sim_file: ${extract_model_streamflow.outputs.timeseries_file}
    obs_file: ${extract_observed_streamflow.outputs.timeseries_file}
  outputs:
    metrics_file: streamflow_metrics.csv
    n_gauges: n_metrics
- id: plot_basin_streamflow
  tool: plot_basin_timeseries
  params:
    basins_file: ${settings.basin_polygons}
    sim_file: ${extract_model_streamflow.outputs.timeseries_file}
    obs_file: ${extract_observed_streamflow.outputs.timeseries_file}
    locations_file: ${load_obs_metadata.outputs.metadata_file}
    gauge_ids: ${settings.basin_ids}
    metrics_file: ${compute_streamflow_metrics.outputs.metrics_file}
  outputs:
    plot_files: basin_streamflow_plots
