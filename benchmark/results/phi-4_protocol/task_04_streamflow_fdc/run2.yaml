name: Streamflow FDC Comparison
description: 'Compare the statistical distribution of E3SM simulated river discharge
  against observations for the period 1985-1989. Match gauges to model grid, extract
  daily discharge data, compute flow duration curve metrics, and visualize results.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/phi-4_protocol/task_04_streamflow_fdc/run2_output
  obs_metadata_file: ./data/sample/obs/gauge_metadata.csv
  obs_data_dir: ./data/sample/obs/streamflow/
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  component: mosart
  variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.obs_metadata_file}
  outputs:
    metadata_file: gauge_metadata_validated.csv
    n_gauges: n_gauges_count
- id: match_gauges_to_grid
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
  outputs:
    matched_file: matched_gauges.csv
    n_matched: n_matched_count
- id: extract_simulated_timeseries
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.variable}
    locations_file: ${match_gauges_to_grid.outputs.matched_file}
    years: ${settings.years}
    frequency: daily
  outputs:
    timeseries_file: simulated_timeseries.csv
    n_locations: n_simulated_locations
- id: extract_observed_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_data_dir}
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: observed_timeseries.csv
    n_gauges: n_observed_gauges
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_simulated_timeseries.outputs.timeseries_file}
    obs_file: ${extract_observed_timeseries.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics.csv
    fdc_file: fdc_percentiles.csv
- id: plot_fdc_comparison
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    plot_file: fdc_comparison.png
