name: Task 02 - Seasonal Runoff Analysis
description: 'This workflow extracts the climatological mean runoff from E3SM land
  model (ELM) monthly output for the period 1985-1989. It computes the area-weighted
  global mean of the QRUNOFF field and produces a map with global statistics overlaid.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/phi-4_protocol/task_02_seasonal_runoff/run4_output
  style: cream_ink
steps:
- id: extract_qrunoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: ${output_dir}/qrunoff_1985-1989.nc
- id: compute_global_mean
  tool: compute_zonal_stats
  params:
    field_file: ${extract_qrunoff_field.outputs.field_file}
    lat_bands: ''
  outputs:
    stats_file: ${output_dir}/global_runoff_stats.csv
- id: plot_runoff_map
  tool: plot_gridded_map
  params:
    field_file: ${extract_qrunoff_field.outputs.field_file}
    units: mm/day
    stats_file: ${compute_global_mean.outputs.stats_file}
  outputs:
    plot_file: ${output_dir}/global_runoff_map.png
