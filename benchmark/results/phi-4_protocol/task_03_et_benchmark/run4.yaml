name: ET Benchmarking Workflow
description: 'This workflow benchmarks E3SM land model evapotranspiration against
  MODIS satellite observations using the 5-year climatology from 1985-1989.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/phi-4_protocol/task_03_et_benchmark/run4_output
  style: cream_ink
steps:
- id: fetch_modis_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: ${settings.output_dir}/modis_et.nc
- id: extract_model_et_climatology
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: ${settings.output_dir}/model_et_climatology.nc
- id: extract_obs_et_climatology
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et.outputs.data_file}
    variable: et
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: ${settings.output_dir}/obs_et_climatology.nc
- id: compute_spatial_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_model_et_climatology.outputs.field_file}
    field_b: ${extract_obs_et_climatology.outputs.field_file}
  outputs:
    bias_file: ${settings.output_dir}/et_bias.nc
    stats_file: ${settings.output_dir}/et_bias_stats.csv
- id: plot_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_spatial_bias.outputs.bias_file}
    title: ET Bias (Model minus Obs)
    units: mm/day
  outputs:
    plot_file: ${settings.output_dir}/et_bias_map.png
