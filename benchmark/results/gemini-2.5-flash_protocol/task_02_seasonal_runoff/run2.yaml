name: ELM Mean Runoff Climatology
description: 'Extracts the climatological mean QRUNOFF field from ELM output for 1985-1989,

  computes global area-weighted statistics, and plots a map of the mean runoff

  field with the statistics overlaid.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_02_seasonal_runoff/run2_output
  style: cream_ink
steps:
- id: extract_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
  outputs:
    field_file: ${settings.output_dir}/elm_mean_runoff_1985-1989.nc
- id: compute_global_stats
  tool: compute_zonal_stats
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    variable: QRUNOFF
    lat_bands: ''
  outputs:
    stats_file: ${settings.output_dir}/global_runoff_stats.csv
- id: plot_mean_runoff_map
  tool: plot_gridded_map
  params:
    field_file: ${extract_runoff_field.outputs.field_file}
    variable: QRUNOFF
    title: ELM Mean Runoff (1985-1989)
    units: mm/day
    stats_file: ${compute_global_stats.outputs.stats_file}
  outputs:
    plot_file: ${settings.output_dir}/elm_mean_runoff_map.png
