name: E3SM ELM ET Benchmark vs MODIS
description: 'Benchmarks E3SM ELM evapotranspiration (ET) against MODIS satellite
  observations.

  Calculates the 5-year (1985-1989) climatological mean ET for both model and observations,

  computes the spatial bias (model - obs), and generates a map of the bias field

  along with global statistics.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_03_et_benchmark/run2_output
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  style: cream_ink
steps:
- id: fetch_modis_et_raw
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: ${settings.output_dir}/modis_et_raw.nc
- id: extract_e3sm_et_mean
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: ${settings.output_dir}/e3sm_elm_et_mean_1985_1989.nc
- id: extract_modis_et_mean
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_modis_et_raw.outputs.data_file}
    variable: et
    years: ${settings.years}
  outputs:
    field_file: ${settings.output_dir}/modis_et_mean_1985_1989.nc
- id: compute_et_spatial_bias
  tool: compute_spatial_bias
  params:
    field_a: ${extract_e3sm_et_mean.outputs.field_file}
    field_b: ${extract_modis_et_mean.outputs.field_file}
  outputs:
    bias_file: ${settings.output_dir}/et_bias_e3sm_minus_modis.nc
    stats_file: ${settings.output_dir}/et_bias_stats.csv
- id: plot_et_bias_map
  tool: plot_gridded_map
  params:
    field_file: ${compute_et_spatial_bias.outputs.bias_file}
    title: E3SM ELM ET Bias (1985-1989)
    units: mm/day
    stats_file: ${compute_et_spatial_bias.outputs.stats_file}
  outputs:
    plot_file: ${settings.output_dir}/et_bias_map.png
