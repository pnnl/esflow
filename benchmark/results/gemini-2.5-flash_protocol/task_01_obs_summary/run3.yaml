name: Observed Streamflow Summary
description: 'Loads GRDC gauge metadata, extracts monthly streamflow observations
  for

  specific gauges and years, and computes summary statistics for these observations.

  '
settings:
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_01_obs_summary/run3_output
steps:
- id: load_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ./data/sample/obs/gauge_metadata.csv
  outputs:
    metadata_file: gauge_metadata.csv
- id: extract_streamflow
  tool: extract_obs_timeseries
  params:
    obs_dir: ./data/sample/obs/streamflow/
    gauge_metadata: ${load_metadata.outputs.metadata_file}
    years:
    - 1985
    - 1986
    - 1987
    - 1988
    - 1989
    gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  outputs:
    timeseries_file: obs_streamflow_1985-1989.csv
- id: compute_stats
  tool: compute_summary_stats
  params:
    timeseries_file: ${extract_streamflow.outputs.timeseries_file}
    gauge_metadata: ${load_metadata.outputs.metadata_file}
  outputs:
    stats_file: obs_streamflow_summary_stats.csv
