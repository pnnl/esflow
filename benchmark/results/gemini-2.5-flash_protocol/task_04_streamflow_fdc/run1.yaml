name: Streamflow FDC Analysis (1985-1989)
description: 'Compares E3SM MOSART simulated river discharge against observations
  using Flow Duration Curves (FDCs)

  for the period 1985-1989. Computes FDC distributional metrics and visualizes

  Wasserstein distance on a map with FDC comparison panels for selected gauges.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  obs_dir: ./data/sample/obs/streamflow/
  gauge_metadata_file: ./data/sample/obs/gauge_metadata.csv
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_04_streamflow_fdc/run1_output
  analysis_years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  model_component: mosart
  model_discharge_variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  plot_gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  style: cream_ink
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata_file}
  outputs:
    metadata_file: ${settings.output_dir}/gauge_metadata.csv
    n_gauges: n_gauges
- id: match_gauges_to_grid
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.model_component}
  outputs:
    matched_file: ${settings.output_dir}/matched_gauges.csv
    n_matched: n_matched_gauges
- id: extract_e3sm_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.model_component}
    variable: ${settings.model_discharge_variable}
    locations_file: ${match_gauges_to_grid.outputs.matched_file}
    years: ${settings.analysis_years}
    frequency: daily
  outputs:
    timeseries_file: ${settings.output_dir}/e3sm_discharge_daily_1985-1989.csv
    n_locations: n_e3sm_extracted
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.analysis_years}
  outputs:
    timeseries_file: ${settings.output_dir}/obs_discharge_daily_1985-1989.csv
    n_gauges: n_obs_extracted
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_e3sm_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: ${settings.output_dir}/fdc_metrics.csv
    fdc_file: ${settings.output_dir}/fdc_percentiles.csv
- id: plot_fdc_comparison
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    metric: wasserstein
    gauge_ids: ${settings.plot_gauge_ids}
  outputs:
    plot_file: ${settings.output_dir}/fdc_comparison_map_and_panels.png
