name: E3SM MOSART River Discharge FDC Analysis
description: 'Compares the statistical distribution of E3SM MOSART simulated river
  discharge

  against observations for 1985-1989 using Flow Duration Curves (FDCs).

  Calculates FDC metrics (volume bias, Wasserstein distance, quantile ratios)

  and visualizes the Wasserstein distance on a map with FDC panels for

  selected major river basins.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  obs_dir: ./data/sample/obs/streamflow/
  gauge_metadata_file: ./data/sample/obs/gauge_metadata.csv
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_04_streamflow_fdc/run2_output
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  component: mosart
  model_variable: RIVER_DISCHARGE_OVER_LAND_LIQ
  plot_gauges: 3629000,4121801,4115200,6742900,2969100,1159100
  style: cream_ink
steps:
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata_file}
  outputs:
    metadata_file: gauge_metadata.csv
- id: match_gauges_to_model
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
  outputs:
    matched_file: matched_gauges.csv
- id: extract_e3sm_discharge
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: ${settings.component}
    variable: ${settings.model_variable}
    locations_file: ${match_gauges_to_model.outputs.matched_file}
    years: ${settings.years}
    frequency: daily
  outputs:
    timeseries_file: e3sm_discharge_daily_1985-1989.csv
- id: extract_obs_discharge
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
  outputs:
    timeseries_file: obs_discharge_daily_1985-1989.csv
- id: compute_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_e3sm_discharge.outputs.timeseries_file}
    obs_file: ${extract_obs_discharge.outputs.timeseries_file}
  outputs:
    metrics_file: fdc_metrics.csv
    fdc_file: fdc_percentiles.csv
- id: plot_fdc_comparison
  tool: plot_fdc
  params:
    metrics_file: ${compute_fdc_metrics.outputs.metrics_file}
    fdc_file: ${compute_fdc_metrics.outputs.fdc_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
    metric: wasserstein
    gauge_ids: ${settings.plot_gauges}
  outputs:
    plot_file: fdc_comparison_map_and_panels.png
