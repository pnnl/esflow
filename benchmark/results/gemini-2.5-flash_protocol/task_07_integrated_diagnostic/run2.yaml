name: Integrated Water Cycle Evaluation
description: 'Performs an integrated water cycle evaluation for E3SM over 1985-1989

  for six major river basins, diagnosing model biases across P, ET, Q,

  and streamflow FDC metrics.

  '
settings:
  case_name: sample.v3.LR.historical
  data_dir: ./data/sample/e3sm/
  obs_dir: ./data/sample/obs/
  output_dir: /Users/zhou014/Local_Drive/Git_repo/esmflow/benchmark/results/gemini-2.5-flash_protocol/task_07_integrated_diagnostic/run2_output
  years:
  - 1985
  - 1986
  - 1987
  - 1988
  - 1989
  basins_file: ./data/sample/obs/basin_polygons.geojson
  gauge_metadata_file: ./data/sample/obs/gauge_metadata.csv
  gauge_ids: 3629000,4121801,4115200,6742900,2969100,1159100
  style: cream_ink
steps:
- id: extract_model_precip_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: RAIN+SNOW
    years: ${settings.years}
  outputs:
    field_file: model_precip_field.nc
- id: extract_model_et_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QVEGE+QVEGT+QSOIL
    years: ${settings.years}
  outputs:
    field_file: model_et_field.nc
- id: extract_model_runoff_field
  tool: extract_gridded_field
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: elm
    variable: QRUNOFF
    years: ${settings.years}
  outputs:
    field_file: model_runoff_field.nc
- id: fetch_obs_precip
  tool: fetch_ilamb_data
  params:
    variable: pr
    dataset: GPCCv2018
  outputs:
    data_file: obs_precip_raw.nc
- id: extract_obs_precip_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_precip.outputs.data_file}
    variable: pr
    years: ${settings.years}
  outputs:
    field_file: obs_precip_field.nc
- id: fetch_obs_et
  tool: fetch_ilamb_data
  params:
    variable: evspsbl
    dataset: MODIS
  outputs:
    data_file: obs_et_raw.nc
- id: extract_obs_et_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_et.outputs.data_file}
    variable: et
    years: ${settings.years}
  outputs:
    field_file: obs_et_field.nc
- id: fetch_obs_runoff
  tool: fetch_ilamb_data
  params:
    variable: mrro
    dataset: LORA
  outputs:
    data_file: obs_runoff_raw.nc
- id: extract_obs_runoff_field
  tool: extract_gridded_field
  params:
    obs_file: ${fetch_obs_runoff.outputs.data_file}
    variable: mrro
    years: ${settings.years}
  outputs:
    field_file: obs_runoff_field.nc
- id: basin_mean_model_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_precip_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_model_precip.csv
- id: basin_mean_model_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_et_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_model_et.csv
- id: basin_mean_model_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_model_runoff_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_model_runoff.csv
- id: basin_mean_obs_precip
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_precip_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_obs_precip.csv
- id: basin_mean_obs_et
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_et_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_obs_et.csv
- id: basin_mean_obs_runoff
  tool: extract_basin_mean
  params:
    field_file: ${extract_obs_runoff_field.outputs.field_file}
    basins_file: ${settings.basins_file}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    basin_means_file: basin_mean_obs_runoff.csv
- id: load_gauge_metadata
  tool: load_obs_metadata
  params:
    metadata_file: ${settings.gauge_metadata_file}
  outputs:
    metadata_file: gauge_metadata_validated.csv
    n_gauges: num_gauges
- id: match_gauges_to_mosart
  tool: match_to_grid
  params:
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
  outputs:
    matched_file: matched_mosart_gauges.csv
    n_matched: num_matched_mosart_gauges
- id: extract_e3sm_streamflow_timeseries
  tool: extract_e3sm_timeseries
  params:
    data_dir: ${settings.data_dir}
    case_name: ${settings.case_name}
    component: mosart
    variable: RIVER_DISCHARGE_OVER_LAND_LIQ
    locations_file: ${match_gauges_to_mosart.outputs.matched_file}
    years: ${settings.years}
  outputs:
    timeseries_file: e3sm_streamflow_timeseries.csv
    n_locations: num_e3sm_streamflow_locations
- id: extract_obs_streamflow_timeseries
  tool: extract_obs_timeseries
  params:
    obs_dir: ${settings.obs_dir}/streamflow/
    gauge_metadata: ${load_gauge_metadata.outputs.metadata_file}
    years: ${settings.years}
    gauge_ids: ${settings.gauge_ids}
  outputs:
    timeseries_file: obs_streamflow_timeseries.csv
    n_gauges: num_obs_streamflow_gauges
- id: compute_streamflow_fdc_metrics
  tool: compute_fdc_metrics
  params:
    sim_file: ${extract_e3sm_streamflow_timeseries.outputs.timeseries_file}
    obs_file: ${extract_obs_streamflow_timeseries.outputs.timeseries_file}
  outputs:
    metrics_file: streamflow_fdc_metrics.csv
    fdc_file: streamflow_fdc_data.csv
- id: compute_basin_budget_summary
  tool: compute_basin_budget
  params:
    model_precip_file: ${basin_mean_model_precip.outputs.basin_means_file}
    model_et_file: ${basin_mean_model_et.outputs.basin_means_file}
    model_runoff_file: ${basin_mean_model_runoff.outputs.basin_means_file}
    obs_precip_file: ${basin_mean_obs_precip.outputs.basin_means_file}
    obs_et_file: ${basin_mean_obs_et.outputs.basin_means_file}
    obs_runoff_file: ${basin_mean_obs_runoff.outputs.basin_means_file}
    fdc_metrics_file: ${compute_streamflow_fdc_metrics.outputs.metrics_file}
    locations_file: ${load_gauge_metadata.outputs.metadata_file}
  outputs:
    budget_file: basin_water_budget_summary.csv
- id: plot_basin_budget_comparison
  tool: plot_basin_budget_comparison
  params:
    budget_file: ${compute_basin_budget_summary.outputs.budget_file}
  outputs:
    plot_file: basin_budget_comparison.png
- id: plot_basin_radar_chart
  tool: plot_basin_radar
  params:
    budget_file: ${compute_basin_budget_summary.outputs.budget_file}
  outputs:
    plot_file: basin_radar_chart.png
